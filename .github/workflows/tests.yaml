name: 'Unit Tests'

on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Create .dev.vars
        run: echo "SESSION_SECRET_KEY=test-secret-key-for-workers-tests" > .dev.vars

      - run: |
          pnpm install
          pnpm biome:check
          pnpm knip:check
          pnpm types:check
          pnpm test:run

      - run: pnpm test:workers