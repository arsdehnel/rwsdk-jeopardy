name: Publish Reports

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    permissions:
      contents: write

    steps:
      - name: Install git-lfs
        run: apt-get update && apt-get install -y git-lfs

      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests with coverage
        run: pnpm test:run

      - name: Stage unit coverage
        run: mkdir -p _reports/unit && cp -r coverage/. _reports/unit/

      - name: Run Playwright CT tests
        run: pnpm playwright-ct:run
        env:
          HOME: /root

      - name: Stage CT report
        run: mkdir -p _reports/ct && cp -r playwright-report/. _reports/ct/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_reports
          destination_dir: reports
          keep_files: true
